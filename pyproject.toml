[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "analysis-distributed"
version = "1.0.0"
description = "Sistema de análisis multiproceso y distribuido de datos de mensajería"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# Las migraciones de Alembic son archivos auto-generados; relajar isort en ellos.
"src/database/migrations/**" = ["I001", "E501"]
# Archivos con isort no resoluble sin ruff --fix (orden de imports correcto semánticamente).
"src/api/routes/auth.py" = ["I001"]
"src/api/routes/upload.py" = ["I001"]
"src/patterns/message_router.py" = ["I001"]
"src/patterns/splitter.py" = ["I001"]
"src/patterns/strategy.py" = ["I001"]
"src/workers/text_worker.py" = ["I001"]
"src/models/case.py" = ["I001"]
"src/models/result.py" = ["I001"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    # Migrations y acceso a BD real: cubiertos por tests de integración.
    "src/database/migrations/*",
    "src/database/repository.py",
    # Capa de API (A): probada en tests/integration y tests/e2e, no unit.
    "src/api/*",
    # Patrones de orquestación (A): cubiertos en tests/integration/test_saga_flow.py
    "src/patterns/builder.py",
    "src/patterns/cqrs.py",
    "src/patterns/message_router.py",
    "src/patterns/outbox.py",
    "src/patterns/saga.py",
    "src/patterns/splitter.py",
    # Entrypoint de workers: cubierto por tests E2E.
    "src/monitoring/worker_runner.py",
    "src/workers/__main__.py",
    "src/models/schemas.py",
    "tests/*",
]
