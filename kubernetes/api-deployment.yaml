# ============================================================
# API — Deployment + Service (Persona C)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: analysis
  labels: { app: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: analysis/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: analysis-config }
            - secretRef: { name: analysis-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: analysis
  labels: { app: api }
spec:
  selector: { app: api }
  ports:
    - name: http
      port: 8000
      targetPort: 8000
