# ============================================================
# Namespace + ConfigMaps (Persona C)
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: analysis
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: analysis-config
  namespace: analysis
data:
  APP_ENV: "production"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_TOPIC_TEXT: "analysis.text.tasks"
  KAFKA_TOPIC_IMAGE: "analysis.image.tasks"
  KAFKA_TOPIC_AUDIO: "analysis.audio.tasks"
  KAFKA_TOPIC_RESULTS: "analysis.results"
  KAFKA_GROUP_ID: "analysis-workers"
  # En K8s las réplicas de lectura se sirven con un operador (CloudNativePG /
  # bitnami). Por defecto apuntan al mismo servicio primary (degrada a primary).
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "analysis_db"
  POSTGRES_USER: "postgres"
  POSTGRES_REPLICA1_HOST: "postgres"
  POSTGRES_REPLICA2_HOST: "postgres"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  WORKER_METRICS_PORT: "8001"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: analysis
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: api
        metrics_path: /metrics
        static_configs:
          - targets: ["api:8000"]
            labels: { component: api }
      - job_name: workers
        static_configs:
          - targets: ["worker-text:8001"]
            labels: { worker: text }
          - targets: ["worker-image:8001"]
            labels: { worker: image }
          - targets: ["worker-audio:8001"]
            labels: { worker: audio }
  alerts.yml: |
    groups:
      - name: disponibilidad
        rules:
          - alert: APICaida
            expr: up{job="api"} == 0
            for: 1m
            labels: { severity: critical }
            annotations: { summary: "API caída" }
          - alert: WorkerCaido
            expr: up{job="workers"} == 0
            for: 2m
            labels: { severity: critical }
            annotations: { summary: "Worker {{ $labels.worker }} caído" }
