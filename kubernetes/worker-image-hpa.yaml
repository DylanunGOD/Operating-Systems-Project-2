apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-image
  namespace: analysis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-image
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
