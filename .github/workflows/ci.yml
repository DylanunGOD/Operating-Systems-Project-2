name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar herramientas de lint
        run: pip install ruff==0.4.4 black==24.4.2
      - name: Ruff
        run: ruff check src/ tests/
      - name: Black (check)
        run: black --check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias de CI
        run: pip install -r requirements-ci.txt
      - name: Unit tests + cobertura
        # pyproject aplica --cov=src --cov-fail-under=80 automáticamente.
        run: pytest tests/unit/

  docker-build:
    # Verifica que las imágenes construyen (no las publica).
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: analysis/api:ci
