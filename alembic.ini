[alembic]
# Carpeta donde vive env.py y versions/
script_location = src/database/migrations

# Agregar la raíz del proyecto al sys.path para que env.py pueda importar src.*
prepend_sys_path = .

# Formato del nombre de archivo de las nuevas migraciones
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone para los timestamps
timezone = UTC

# Truncamos slugs largos
truncate_slug_length = 40

# La URL real se setea programáticamente en env.py desde Settings
sqlalchemy.url = driver://user:pass@localhost/dbname


# ─────────────────────────────────────────
# Logging
# ─────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
